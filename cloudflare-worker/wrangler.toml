name = "mcptest-io"
main = "src/index.js"
compatibility_date = "2025-07-30"

# The state API stays on workers.dev; the public catalog badge route is also
# mounted on the site so README embeds use https://mcptest.io/badge/server/<id>.svg.
# Published report permalinks (/r/*) and their live badges (/badge/report/*) are
# mounted on the site too; the app publishes through VITE_CLOUDFLARE_WORKER_URL.
workers_dev = true
routes = [
  { pattern = "mcptest.io/badge/server/*", zone_name = "mcptest.io" },
  { pattern = "mcptest.io/badge/report/*", zone_name = "mcptest.io" },
  { pattern = "mcptest.io/r", zone_name = "mcptest.io" },
  { pattern = "mcptest.io/r/*", zone_name = "mcptest.io" },
  # Catalog submissions from the /submit page are posted same-origin.
  { pattern = "mcptest.io/api/catalog/submissions", zone_name = "mcptest.io" }
]

[vars]
# Replace with your actual Firebase project ID
FIREBASE_PROJECT_ID = "mcptest-a530d"

[durable_objects]
bindings = [
  { name = "USER_STATE", class_name = "UserState" },
  # Published report snapshots and publish rate limits, keyed by endpoint (see
  # cloudflare-worker/src/PublishedReports.js). No secrets are required.
  { name = "PUBLISHED_REPORTS", class_name = "PublishedReports" },
  # Per-IP and per-host counters for POST /api/catalog/submissions.
  { name = "SUBMISSION_RATE_LIMITER", class_name = "SubmissionRateLimiter" }
]

[[migrations]]
tag = "v1"
new_classes = ["UserState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PublishedReports"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SubmissionRateLimiter"]

# Weekly watch of opted-in published endpoints (src/weeklyWatch.js). Each hourly
# run checks at most WATCH_BATCH_PER_RUN endpoints that are due, so every watched
# endpoint is listed about once a week and one run stays within Worker limits.
# The watch stores its snapshots in PublishedReports under new keys: no migration.
[triggers]
crons = ["23 * * * *"]

[observability.logs]
enabled = true

[alias]
# The submissions route bundles src/utils/catalogSubmissionSchema.ts from the app tree,
# so bare imports there resolve against the app, not this package. Point them here.
"@cfworker/json-schema" = "./node_modules/@cfworker/json-schema/dist/esm/index.js"
