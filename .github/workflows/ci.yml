name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cors-proxy-worker/package-lock.json
            cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix cors-proxy-worker
          npm ci --prefix cloudflare-worker

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate catalog assets
        run: npm run validate-catalog-assets

      - name: Build web app and static pages
        run: npm run build

      - name: Build workers (dry run)
        run: npm run build:workers
