name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cors-proxy-worker/package-lock.json
            cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix cors-proxy-worker
          npm ci --prefix cloudflare-worker

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate catalog assets
        run: npm run validate-catalog-assets

      - name: Build web app and static pages
        run: npm run build

      - name: First paint of the built home page
        run: npm run test:first-paint

      - name: Chunk graph of the built site
        run: npm run test:bundle-graph

      # External links are listed, not fetched; maintainers run npm run check-links:external.
      - name: Internal links of the built site
        run: npm run check-links

      - name: Sitemap, robots and canonical audit of the built site
        run: npm run test:site-audit

      # The e2e job reuses this build instead of building again.
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Build workers (dry run)
        run: npm run build:workers

  e2e:
    name: End-to-end smoke and Lighthouse budgets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright smoke and WCAG 2.2 accessibility gate
        run: npm run test:e2e

      - name: Accessibility findings summary
        if: always()
        run: node tests/e2e/accessibility-summary.mjs

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Lighthouse runs the same pinned Chromium the smoke suite used.
      - name: Lighthouse budgets (desktop)
        id: lighthouse
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:lighthouse

      - name: Lighthouse budgets (mobile)
        if: success() || steps.lighthouse.outcome == 'failure'
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:lighthouse:mobile

      - name: Upload the Lighthouse reports
        if: always() && steps.lighthouse.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  action-smoke:
    name: Local composite action against stateless MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Start mock MCP server
        run: |
          node tests/e2e/mock-mcp-server.mjs > "$RUNNER_TEMP/mock-mcp.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4180/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run this checkout's composite action
        id: gate
        uses: ./
        with:
          endpoints: http://127.0.0.1:4180/2026/mcp
          session-resilience: 'true'
          comment: 'true'
          publish: 'false'
      - name: Assert action outputs
        env:
          DECISION: ${{ steps.gate.outputs.decision }}
          BREAKING_COUNT: ${{ steps.gate.outputs.breaking-count }}
          REPORT_PATH: ${{ steps.gate.outputs.report-path }}
        run: |
          test "$DECISION" = ready || test "$DECISION" = review
          test "$BREAKING_COUNT" = 0
          test -f "$REPORT_PATH/summary.md"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: action-smoke-reports
          path: mcptest-reports/
