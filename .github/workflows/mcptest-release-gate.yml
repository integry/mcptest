name: mcptest release gate

on:
  workflow_call:
    inputs:
      mcptest_ref:
        description: Exact integry/mcptest commit SHA used in the calling job's uses value
        required: true
        type: string
      endpoints:
        description: Newline-delimited remote MCP endpoint URLs
        required: true
        type: string
      credential_mode:
        description: public, bearer, or api-key
        required: false
        default: public
        type: string
      fail_on_result:
        description: Comma-separated release results, or none
        required: false
        default: blocked,unknown
        type: string
      fail_on_severity:
        description: critical, high, medium, unknown, or none
        required: false
        default: high
        type: string
    secrets:
      MCPTEST_BEARER_TOKEN:
        required: false
      MCPTEST_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      endpoints:
        description: Newline-delimited remote MCP endpoint URLs
        required: true
        type: string
      credential_mode:
        description: public, bearer, or api-key
        required: false
        default: public
        type: choice
        options:
          - public
          - bearer
          - api-key
      fail_on_result:
        description: Comma-separated release results, or none
        required: false
        default: blocked,unknown
        type: string
      fail_on_severity:
        description: critical, high, medium, unknown, or none
        required: false
        default: high
        type: choice
        options:
          - critical
          - high
          - medium
          - unknown
          - none

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      MCPTEST_ENDPOINTS: ${{ inputs.endpoints }}
      MCPTEST_CREDENTIAL_MODE: ${{ inputs.credential_mode }}
      MCPTEST_FAIL_RESULTS: ${{ inputs.fail_on_result }}
      MCPTEST_FAIL_SEVERITY: ${{ inputs.fail_on_severity }}
    defaults:
      run:
        working-directory: mcptest
    steps:
      - name: Validate reusable workflow ref
        if: inputs.mcptest_ref != ''
        id: reusable_ref
        uses: actions/github-script@v7
        env:
          MCPTEST_REQUESTED_REF: ${{ inputs.mcptest_ref }}
        with:
          script: |
            const requestedRef = process.env.MCPTEST_REQUESTED_REF;
            if (!/^[0-9a-f]{40}$/.test(requestedRef)) {
              core.setFailed('mcptest_ref must be the exact 40-character commit SHA used by the reusable workflow caller');
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRunAttempt({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            const expectedWorkflowPath = 'integry/mcptest/.github/workflows/mcptest-release-gate.yml';
            const referencedWorkflows = (run.referenced_workflows ?? []).filter(({ path }) => {
              const refSeparator = path.lastIndexOf('@');
              return refSeparator !== -1
                && path.slice(0, refSeparator).toLowerCase() === expectedWorkflowPath;
            });
            const resolvedRefs = new Set(referencedWorkflows.map(({ sha }) => sha));
            if (resolvedRefs.size > 1) {
              core.setFailed('Cannot validate mcptest_ref because this run invokes the mcptest release gate at multiple commit SHAs');
              return;
            }

            const expectedPath = `${expectedWorkflowPath}@${requestedRef}`;
            const invokedWorkflow = referencedWorkflows.find(
              ({ path }) => path.toLowerCase() === expectedPath,
            );
            if (!invokedWorkflow || invokedWorkflow.sha !== requestedRef) {
              core.setFailed('mcptest_ref must match the commit SHA pinned in the reusable workflow uses value');
              return;
            }
            core.setOutput('ref', requestedRef);
      - name: Select workflow dispatch ref
        if: inputs.mcptest_ref == ''
        id: dispatch_ref
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MCPTEST_DISPATCH_SHA: ${{ github.workflow_sha }}
        run: |
          if [[ ! "$MCPTEST_DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not determine the exact mcptest commit for workflow_dispatch" >&2
            exit 3
          fi
          echo "ref=$MCPTEST_DISPATCH_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: integry/mcptest
          ref: ${{ steps.reusable_ref.outputs.ref || steps.dispatch_ref.outputs.ref }}
          path: mcptest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcptest/package-lock.json
      - run: npm ci
      - name: Validate credential mode
        shell: bash
        run: |
          case "$MCPTEST_CREDENTIAL_MODE" in
            public|bearer|api-key) ;;
            *) echo "credential_mode must be public, bearer, or api-key" >&2; exit 3 ;;
          esac
      - name: Evaluate public endpoints
        if: inputs.credential_mode == 'public'
        run: >-
          npm run mcptest --
          --endpoints-env MCPTEST_ENDPOINTS
          --fail-on-result "$MCPTEST_FAIL_RESULTS"
          --fail-on-severity "$MCPTEST_FAIL_SEVERITY"
      - name: Evaluate with bearer token
        if: inputs.credential_mode == 'bearer'
        env:
          MCPTEST_BEARER_TOKEN: ${{ secrets.MCPTEST_BEARER_TOKEN }}
        run: >-
          npm run mcptest --
          --endpoints-env MCPTEST_ENDPOINTS
          --bearer-token-env MCPTEST_BEARER_TOKEN
          --fail-on-result "$MCPTEST_FAIL_RESULTS"
          --fail-on-severity "$MCPTEST_FAIL_SEVERITY"
      - name: Evaluate with API key
        if: inputs.credential_mode == 'api-key'
        env:
          MCPTEST_API_KEY: ${{ secrets.MCPTEST_API_KEY }}
        run: >-
          npm run mcptest --
          --endpoints-env MCPTEST_ENDPOINTS
          --api-key-env MCPTEST_API_KEY
          --fail-on-result "$MCPTEST_FAIL_RESULTS"
          --fail-on-severity "$MCPTEST_FAIL_SEVERITY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcptest-reports
          path: mcptest/mcptest-reports/
          if-no-files-found: ignore
