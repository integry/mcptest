name: Catalog revalidation

# Re-probes every catalog endpoint and opens (or updates) one pull request with
# the fresh validation evidence. Runs only on the schedule and on manual dispatch.
on:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-revalidation
  cancel-in-progress: false

env:
  PR_BRANCH: bot/catalog-revalidation

jobs:
  revalidate:
    name: Revalidate catalog evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Keep the current evidence for the diff
        run: |
          cp src/data/catalogValidation.json "$RUNNER_TEMP/before-validation.json"
          cp src/data/catalogCapabilities.json "$RUNNER_TEMP/before-capabilities.json"

      # Each request times out after 12s and each server after 120s (scripts/validate-catalog.js).
      - name: Validate live endpoints
        run: npm run validate-catalog

      - name: Verify capability snapshots
        run: npm run import-catalog-capabilities -- --all

      - name: Validate catalog assets
        run: npm run validate-catalog-assets

      - name: Summarize evidence changes
        id: summary
        run: |
          npm run --silent summarize-catalog-diff -- \
            --before-validation "$RUNNER_TEMP/before-validation.json" \
            --after-validation src/data/catalogValidation.json \
            --before-capabilities "$RUNNER_TEMP/before-capabilities.json" \
            --after-capabilities src/data/catalogCapabilities.json \
            --catalog src/data/serverCatalog.json \
            --output "$RUNNER_TEMP/pr-body.md"
          {
            echo
            echo "---"
            echo
            echo "Generated by the [catalog revalidation workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo "Review steps: \`docs/catalog-submissions.md\` → *Scheduled revalidation*."
          } >> "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- src/data/catalogValidation.json src/data/catalogCapabilities.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs even without changes so a stale bot pull request is closed and its branch removed.
      - name: Open or update the revalidation pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.PR_BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            src/data/catalogValidation.json
            src/data/catalogCapabilities.json
          commit-message: 'Refresh catalog validation evidence'
          title: 'Refresh catalog validation evidence'
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true

      - name: Report result
        env:
          CHANGED: ${{ steps.summary.outputs.changed }}
        run: echo "Catalog evidence changed since the last snapshot - $CHANGED"
